services:
  - type: web
    name: beauty-for-all
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: ADMIN_PIN
        sync: false
      - key: STAFF_PIN
        sync: false
